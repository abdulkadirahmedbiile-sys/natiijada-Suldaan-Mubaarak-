<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8"><title>BEB SYSTEM</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; display: flex; justify-content: center; padding: 20px; }
        .container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        .form-group { margin-bottom: 15px; text-align: left; }
        input, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #1a365d; color: white; font-weight: bold; cursor: pointer; border: none; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 5px; text-align: left; display: none; }
        .error { background: #fed7d7; color: #9b2c2c; }
        .success { background: #f7fafc; border-top: 4px solid #1a365d; }
    </style>
</head>
<body>
<div class="container">
    <h2>BIILE EXAMINATION BOARD (BEB)</h2>
    <div id="error" class="result-box error"></div>

    <!-- LOGIN -->
    <div id="step1">
        <div class="form-group"><label>Username:</label><input type="text" id="user"></div>
        <div class="form-group"><label>Password:</label><input type="password" id="pass"></div>
        <button onclick="login()">LOGIN</button>
    </div>

    <!-- RAADIN -->
    <div id="step2" style="display:none;">
        <div class="form-group"><label>Geli Roll No:</label><input type="text" id="roll"></div>
        <button onclick="showResult()">Hel Natiijada</button>
    </div>

    <div id="result" class="result-box success"></div>
</div>

<script>
    const students = [
        { r: "SM261000", u: "fadumo1sm", p: "sm0001", n: "Fadumo Ibraahim", m: {ISL:85, ARB:81, BIO:70, CHM:56, PHY:73, MTH:90, ENG:79, ICT:100, SOM:100}, t: 804, a: 80.4, g: "B+" },
        { r: "SM261001", u: "sidiiq2", p: "sm0002", n: "Siddiiq Xuseen", m: {ISL:80, ARB:76, BIO:80, CHM:78, PHY:76, MTH:70, ENG:71, ICT:88, SOM:98}, t: 778, a: 77.8, g: "B" },
        { r: "YK26001020", u: "c/shakur7", p: "YK0007", n: "C/shakur C/khalif", m: {ISL:91, ARB:92, PHY:78, MTH:60, SOM:86, BIO:72, CHM:87, ICT:100, ENG:95}, t: 938, a: 85.2, g: "A-" },
        { r: "YK26001001", u: "asiyo8", p: "YK0008", n: "Asiyo Maxamed", m: {ISL:100, ARB:100, PHY:86, MTH:70, SOM:100, BIO:70, CHM:55, ICT:80, ENG:83}, t: 933, a: 84.8, g: "B+" }
    ];

    let currentUser = null;
    const $ = id => document.getElementById(id);

    function login() {
        currentUser = students.find(s => s.u === $('user').value.trim() && s.p === $('pass').value.trim());
        if (currentUser) {
            $('step1').style.display = 'none';
            $('step2').style.display = 'block';
            $('error').style.display = 'none';
        } else {
            $('error').innerText = "Username ama Password waa khalad!";
            $('error').style.display = 'block';
        }
    }

    function showResult() {
        $('error').style.display = 'none';
        $('result').style.display = 'none';

        if ($('roll').value.trim().toUpperCase() !== currentUser.r.toUpperCase()) {
            $('error').innerText = "Roll No kulama jaanqaadayo koontadaada!";
            $('error').style.display = 'block';
            return;
        }

        let mHtml = `<h3>Natiijada: ${currentUser.n}</h3><p>Roll No: ${currentUser.r}</p><hr>`;
        for (let [sub, mark] of Object.entries(currentUser.m)) mHtml += `<p><strong>${sub}:</strong> ${mark}</p>`;
        
        mHtml += `<hr><p><strong>Total:</strong> ${currentUser.t}</p><p><strong>Avg:</strong> ${currentUser.a}%</p><p><strong>Grade:</strong> ${currentUser.g}</p>`;
        $('result').innerHTML = mHtml;
        $('result').style.display = 'block';
    }
</script>
</body>
</html>
