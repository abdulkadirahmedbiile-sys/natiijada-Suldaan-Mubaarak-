<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEB Portal</title>
    <style>
        :root { --blue: #0056b3; --green: #28a745; --red: #dc3545; --white: #fff; }
        * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
        body { background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: var(--white); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); width: 100%; max-width: 600px; padding: 30px; border-top: 6px solid var(--blue); text-align: center; }
        .page { display: none; } .page.active { display: block; }
        img { width: 110px; height: 110px; border-radius: 50%; margin-bottom: 15px; object-fit: cover; }
        h1 { color: #1b3a4b; font-size: 22px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 16px; margin-bottom: 15px; text-align: center; }
        .btn { width: 100%; padding: 12px; background: var(--blue); color: var(--white); border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-back { background: #6c757d; margin-top: 15px; }
        .result-header { background: linear-gradient(135deg, var(--blue), var(--green)); color: var(--white); padding: 18px; border-radius: 8px; margin-bottom: 20px; text-align: left; }
        .result-header h2 { font-size: 18px; margin-bottom: 5px; }
        .result-header p { font-size: 14px; opacity: 0.95; margin-bottom: 3px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background: var(--white); text-align: left; }
        th { background: var(--blue); color: var(--white); padding: 10px; border: 1px solid #dee2e6; }
        td { padding: 10px; border: 1px solid #dee2e6; }
        tr:nth-child(even) { background: #f8f9fa; }
        .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #eef2f7; padding: 15px; border-radius: 8px; border-left: 5px solid var(--green); text-align: left; font-size: 15px; margin-bottom: 15px; }
        .chairman { background: #fff; padding: 12px; border: 1px dashed var(--blue); border-radius: 6px; text-align: center; font-weight: bold; font-size: 14px; color: #1b3a4b; margin-top: 15px; }
        .alert { background: #f8d7da; color: var(--red); border: 2px dashed var(--red); padding: 30px; border-radius: 8px; font-weight: bold; font-size: 18px; margin-top: 20px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="card">
    <!-- BOGGA 1AAD -->
    <div id="p1" class="page active">
        <img src="Logo.jpeg" alt="BEB LOGO">
        <h1>BIILE EXAMINATION BOARD (BEB)</h1>
        <input type="text" id="roll" placeholder="Geli Roll Number-ka">
        <button class="btn" onclick="eeg()">HEL EEG NATIIJADA</button>
    </div>

    <!-- BOGGA 2AAD -->
    <div id="p2" class="page">
        <div id="info"></div>
        <div id="content"></div>
        <button class="btn btn-back" onclick="back()">KU NOQO BOGGA HORE</button>
    </div>
</div>

<script>
    // Xogta rasmiga ah ee 6-da arday ee laga soo minguuriyey dukumentigaaga
    const db = {
        "SM261000": { 
            name: "Faadumo Ibraahim Jaamac", class: "FORM3", school: "SULDAN MUBARAK", pay: false, total: 804, avg: 80.4, grade: "B+",
            subs: [{n:"ISLAMIC",s:85},{n:"ARABIC",s:81},{n:"BIO",s:70},{n:"CHEM",s:56},{n:"PHY",s:73},{n:"MATH",s:90},{n:"ENG",s:79},{n:"B/S",s:70},{n:"ICT",s:100},{n:"SOM",s:100}] 
        },
        "SM261001": { 
            name: "Siddiiq Xuseen Axmed", class: "FORM3", school: "SULDAN MUBARAK", pay: false, total: 778, avg: 77.8, grade: "B",
            subs: [{n:"ISLAMIC",s:80},{n:"ARABIC",s:76},{n:"BIO",s:80},{n:"CHEM",s:78},{n:"PHY",s:76},{n:"MATH",s:70},{n:"ENG",s:71},{n:"B/S",s:61},{n:"ICT",s:88},{n:"SOM",s:98}] 
        },
        "SM261002": { 
            name: "C/laahi Khaalid Khaliil", class: "FORM3", school: "SULDAN MUBARAK", pay: false, total: 771, avg: 77.1, grade: "B",
            subs: [{n:"ISLAMIC",s:85},{n:"ARABIC",s:70},{n:"BIO",s:61},{n:"CHEM",s:54},{n:"PHY",s:71},{n:"MATH",s:85},{n:"ENG",s:81},{n:"B/S",s:74},{n:"ICT",s:100},{n:"SOM",s:90}] 
        },
        "SM261003": { 
            name: "Asiyo Siciid Yaasiin", class: "FORM3", school: "SULDAN MUBARAK", pay: false, total: 726, avg: 72.6, grade: "B-",
            subs: [{n:"ISLAMIC",s:80},{n:"ARABIC",s:80},{n:"BIO",s:45},{n:"CHEM",s:55},{n:"PHY",s:65},{n:"MATH",s:60},{n:"ENG",s:85},{n:"B/S",s:66},{n:"ICT",s:92},{n:"SOM",s:98}] 
        },
        "SM261004": { 
            name: "Maxamuud Cabdi Caydiid", class: "FORM3", school: "SULDAN MUBARAK", pay: true, total: 657, avg: 65.7, grade: "C+",
            subs: [{n:"ISLAMIC",s:85},{n:"ARABIC",s:77},{n:"BIO",s:20},{n:"CHEM",s:18},{n:"PHY",s:50},{n:"MATH",s:98},{n:"ENG",s:83},{n:"B/S",s:62},{n:"ICT",s:70},{n:"SOM",s:94}] 
        },
        "SM261005": { 
            name: "C/laahi Cabdi Caydiid", class: "FORM3", school: "SULDAN MUBARAK", pay: true, total: 600, avg: 60.0, grade: "C",
            subs: [{n:"ISLAMIC",s:60},{n:"ARABIC",s:76},{n:"BIO",s:23},{n:"CHEM",s:21},{n:"PHY",s:46},{n:"MATH",s:52},{n:"ENG",s:77},{n:"B/S",s:73},{n:"ICT",s:76},{n:"SOM",s:96}] 
        }
    };

    function eeg() {
        const val = document.getElementById("roll").value.trim().toUpperCase();
        
        document.getElementById("p1").classList.remove("active");
        document.getElementById("p2").classList.add("active");
        
        const info = document.getElementById("info");
        const cont = document.getElementById("content");
        
        info.innerHTML = "";
        cont.innerHTML = "";

        // 1. Hubi haddii Roll Number-ku khaldan yahay
        if (val === "" || !db[val]) {
            cont.innerHTML = `<div class="alert">ROLL NUMBER-KU WAA KHALDANYAHAY FADLAN HUBI.</div>`;
            return;
        }

        const st = db[val];

        // 2. Hubi haddii lacagtu ku taagantahay (Xayiraad guud oo magaca ah)
        if (!st.pay) {
            cont.innerHTML = `<div class="alert">FADLAN ISKA BIXI LACAGTA KUGU TAAGAN.</div>`;
            return;
        }

        // 3. Muuji xogta ardayga haddii wax walba sax yihiin
        info.innerHTML = `
            <div class="result-header">
                <h2>Ardayga: ${st.name}</h2>
                <p><strong>Roll Number:</strong> ${val}</p>
                <p><strong>Fasalka:</strong> ${st.class}</p>
                <p><strong>Iskuulka:</strong> ${st.school}</p>
            </div>
        `;

        let html = `<table><tr><th>Maaddo</th><th>Dhibco</th><th>Maaddo</th><th>Dhibco</th></tr>`;
        for (let i = 0; i < st.subs.length; i += 2) {
            let s1 = st.subs[i], s2 = st.subs[i+1] || {n:"-",s:"-"};
            html += `<tr><td>${s1.n}</td><td>${s1.s}</td><td>${s2.n}</td><td>${s2.s}</td></tr>`;
        }
        
        html += `</table>`;
        
        let status = st.avg >= 50 ? "GUDBAY" : "DHACAY";
        let statusColor = st.avg >= 50 ? "var(--green)" : "var(--red)";
        
        cont.innerHTML = html + `
        <div class="summary">
            <div><strong>Total:</strong> ${st.total}</div><div><strong>Average:</strong> ${st.avg}%</div>
            <div><strong>Grade:</strong> ${st.grade}</div><div><strong>Status:</strong> <span style="color:${statusColor};font-weight:bold">${status}</span></div>
        </div>
        <div class="chairman">GUDOOMIYAHA GUDIGA IMTIXAANAADKA : ENG AHMED BIILE</div>`;
    }

    function back() {
        document.getElementById("p2").classList.remove("active");
        document.getElementById("p1").classList.add("active");
        document.getElementById("roll").value = "";
    }
</script>
</body>
</html>
